# GitHub Pages deployment workflow for WORKSHEETV3
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Repository permissions needed to publish a Pages site.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify website files
        run: |
          test -f index.html
          test -f multi_theme_title_patch.js
          echo "Website files found."

      - name: Upload GitHub Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: .
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
